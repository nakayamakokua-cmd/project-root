project:
  root: .
  # CodexCLI 側でコンテキストとして読み込ませたいファイル群
  context:
    - codex/prompts/system_prompt.md
    - codex/context/product_context.md
    - Profiles/talk_script_v1.md
    - config/ng_master.json
    - config/script_master.json
    - config/settings.json
  # 生成時の必須ガード（コード変更時は文脈も更新）
  guardrails:
    - "コードの差分と同時に、影響を受ける文脈ファイル(ng_master/script_master/talk_script/system_prompt)の更新パッチも出すこと"
    - "実行手順は 'cat <<EOF' 形式の貼り付け適用を必ず併記"
    - "スキーマ破壊を禁止：Sheets列・JSONキー互換を守る"
  commands:
    run_transcribe: "python -m scripts.transcriber data/sample.mp3 > .cache/last_transcript.json"
    run_analyze: "python -m scripts.analyzer .cache/last_transcript.json > .cache/last_row.json"
    run_sheet: "python -m scripts.sheets_writer .cache/last_row.json || echo 'Sheetsが落ちたのでCSV退避' && cat .cache/last_row.json >> Outputs/csv/append_fallback.ndjson"
    run_all: "make run-all"
